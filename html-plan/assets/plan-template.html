<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PLAN_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-alt: #fbfcfe;
      --text: #192233;
      --muted: #647083;
      --line: #d9dfe8;
      --accent: #2f6f73;
      --accent-soft: #e7f2f1;
      --code: #f1f4f8;
      --done: #087f5b;
      --doing: #a15c07;
      --todo: #315b9d;
      --blocked: #b42318;
      --pending: #5f5a6b;
      --shadow: 0 18px 45px rgba(25, 34, 51, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    a { color: var(--accent); }
    p { margin: 0 0 12px; }
    p:last-child { margin-bottom: 0; }
    h1, h2, h3, h4 { letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); line-height: 1.08; }
    h2 { margin: 0 0 14px; font-size: 22px; line-height: 1.25; }
    h3 { margin: 18px 0 8px; font-size: 17px; line-height: 1.35; }
    h4 { margin: 14px 0 6px; font-size: 15px; line-height: 1.35; }
    ul, ol { margin: 0 0 12px; padding-left: 1.25rem; }
    li + li { margin-top: 6px; }
    blockquote {
      margin: 14px 0;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      color: #23494b;
    }
    code {
      padding: .14rem .36rem;
      border-radius: 6px;
      background: var(--code);
      font-size: .92em;
      overflow-wrap: anywhere;
    }
    pre {
      margin: 14px 0;
      padding: 16px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--code);
    }
    pre code { padding: 0; background: transparent; }
    .page { width: min(1040px, calc(100% - 40px)); margin: 32px auto 56px; }
    .hero {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lead { max-width: 760px; margin-top: 12px; color: var(--muted); font-size: 16px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .content { margin-top: 18px; display: grid; gap: 18px; }
    .section {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(25, 34, 51, .04);
    }
    .section > :first-child { margin-top: 0; }
    .section > :last-child { margin-bottom: 0; }
    .subsection {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-alt);
    }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 14px 0; }
    .card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-alt); }
    .card > :first-child { margin-top: 0; }
    .card > :last-child { margin-bottom: 0; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status.done { color: var(--done); background: #e7f8f1; }
    .status.doing { color: var(--doing); background: #fff4e6; }
    .status.todo { color: var(--todo); background: #eaf1ff; }
    .status.blocked { color: var(--blocked); background: #fff0f0; }
    .status.pending { color: var(--pending); background: #f0eff4; }
    .task-list { list-style: none; padding-left: 0; }
    .task {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .task:last-child { border-bottom: 0; }
    .task input { margin-top: 5px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    th { background: #f3f6fb; font-size: 12px; color: var(--muted); }
    .mermaid {
      display: flex;
      justify-content: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      overflow-x: auto;
    }
    .raw {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 24px, 1040px); margin-top: 18px; }
      .hero, .section { padding: 18px; }
      table { min-width: 560px; }
    }
    @media print {
      body { background: #fff; }
      .page { width: auto; margin: 0; }
      .hero, .section { box-shadow: none; break-inside: avoid; }
    }
  </style>
  <!-- Add Prism or Mermaid assets only when the source plan uses them. -->
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Plan View</p>
      <h1>{{PLAN_TITLE}}</h1>
      <p class="lead">{{PLAN_DESCRIPTION}}</p>
      <div class="meta">
        <span class="pill">Source: {{PLAN_SOURCE}}</span>
        <span class="pill">Updated: {{UPDATED_AT}}</span>
        <span class="pill">Format: {{PLAN_FORMAT}}</span>
      </div>
    </header>

    <div class="content" id="plan-content">
      <!-- Replace this placeholder with sections rendered from the input plan file. Do not keep sample or fixed sections. -->
      {{PLAN_CONTENT}}
    </div>
  </main>
</body>
</html>
